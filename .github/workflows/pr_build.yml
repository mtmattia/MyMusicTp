name: PR Build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Compila anche play/notquitemy: hanno MediaService/Android Auto separati
      - name: Build debug APK
        run: bash ./gradlew --warning-mode all compilePlayDebugJavaWithJavac compileNotquitemyDebugJavaWithJavac assembleTempoDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/tempo/debug/*.apk app-tempo-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-tempo-debug
          path: app-tempo-debug.apk

      - name: Upload Room schemas
        uses: actions/upload-artifact@v6
        with:
          name: room-schemas
          path: app/schemas/

      # Direct download link: pre-release "latest-main" always holds the newest build
      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          target_commitish: ${{ github.sha }}
          name: Ultima build (debug)
          body: "Build di debug automatica, commit ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: app-tempo-debug.apk
